help.downLoadFailed.content = C\u00F3 v\u1EBB nh\u01B0 b\u1EA1n t\u1EA3i thi\u1EBFu ch\u01B0\u01A1ng?\r\n--------------------------\r\nH\u00E3y th\u1EED t\u1EA3i ch\u1EADm l\u1EA1i theo h\u01B0\u1EDBng d\u1EABn sau:\r\nTr\u00EAn ph\u1EA7n m\u1EC1m:\r\n + T\u1EC7p > C\u00E0i \u0110\u1EB7t: gi\u1EA3m s\u1ED1 lu\u1ED3ng "MaxConnection" xu\u1ED1ng , MaxConnection = 1 s\u1EBD lu\u00F4n \u0111\u1EE7\r\n + n\u1EBFu \u0111\u00E3 gi\u1EA3m "MaxConnection" m\u00E0 v\u1EABn thi\u1EBFu, th\u00EC t\u0103ng "Kho\u1EA3ng Ngh\u1EC9" = 3000 \u0111\u1EBFn 5500.\r\n + M\u1ED9t v\u00E0i trang th\u1EF1c hi\u1EC7n ch\u1EB7n t\u1EA3i qua vi\u1EC7c ch\u1ED1ng load trang nhanh th\u00EC c\u0169ng th\u1EED t\u0103ng "Kho\u1EA3ng Ngh\u1EC9", v\u00E0 th\u1EED l\u1EA1i.\r\n\r\nXem h\u01B0\u1EDBng d\u1EABn t\u1EA1i fanpage:\r\n#error_gfhu0001 :https://www.facebook.com/gethtmlfromurl/posts/2115995242009114\r\n--------------------------\r\nNguy\u00EAn nh\u00E2n t\u1EA3i thi\u1EBFu:\r\n1. Trang t\u1EA3i truy\u1EC7n ch\u1EADm kh\u00F4ng \u0111\u00E1p \u1EE9ng \u0111\u01B0\u1EE3c\r\n2. Trang t\u1EA3i truy\u1EC7n gi\u1EDBi h\u1EA1n t\u1EA3i, ph\u00E1t hi\u1EC7n n\u1EBFu b\u1EA1n t\u1EA3i trang qu\u00E1 nhanh s\u1EBD ch\u1EB7n l\u1EA1i\r\n3. M\u1EA1ng k\u00E9m\r\n
