QuickLoginFromCookies.txtPnlTip.text=This feature use for quick login from cookies on your browser, instead of click menu "Login" and do it very difficultly in some host.\r\n\r\nIf you has logged in host(or do that first) and then\:\r\n1. On GHFU press menu Tweak -> Quick Login From Cookies ->click button "Copy Script To Get  Cookies"\r\n2. Open browser(Chrome|Firefox) -> open site(ex\: truyencv.com)\r\n3. Press F12 or CTRL + SHIFT + I for Chrome| Firefox , there was Window open .\r\n4. Click to tab "Console", and paste script then press "Enter".\r\n5. Open GHFU choose exact host and click "Paste & Save Login".\r\n6. Done you're save login info to GHFU, now you can download VIP content or other required logged in.
