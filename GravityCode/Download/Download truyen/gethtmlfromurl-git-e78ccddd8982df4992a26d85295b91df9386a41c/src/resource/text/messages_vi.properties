QuickLoginFromCookies.txtPnlTip.text=T\u00EDnh n\u0103ng n\u00E0y d\u00F9ng \u0111\u1EC3 \u0111\u0103ng nh\u1EADp nhanh t\u1EEB phi\u00EAn \u0111\u0103ng nh\u1EADp \u0111\u00E3 c\u00F3 tr\u00EAn tr\u00ECnh duy\u1EC7t, \r\nthay v\u00EC ph\u1EA3i nh\u1EA5n Menu \u0110\u0103ng nh\u1EADp v\u00EC g\u1EB7p v\u00E0i kh\u00F3 kh\u0103n (v\u00ED d\u1EE5 truyencv.com).\r\n\r\nN\u1EBFu b\u1EA1n \u0111\u00E3 \u0111\u0103ng nh\u1EADp v\u00E0o m\u1ED9t host(ho\u1EB7c ch\u01B0a th\u00EC h\u00E3y l\u00E0m tr\u00EAn tr\u00ECnh duy\u1EC7t s\u1EBD d\u1EC5 h\u01A1n) \r\nsau \u0111\u00F3 l\u01B0u th\u00F4ng tin v\u00E0o GHFU nh\u01B0 sau\:\r\n1. Tr\u00EAn GHFU nh\u1EA5n Menu C\u00F4ng C\u1EE5 > \u0110\u0103ng Nh\u1EADp T\u1EEB Cookies > Nh\u1EA5n "Sao ch\u00E9p Script L\u1EA5y Cookies"\r\n2. M\u1EDF tr\u00ECnh duy\u1EC7t(Chrome|Firefox) ch\u1ECDn site m\u00E0 b\u1EA1n \u0111\u00E3 \u0111\u0103ng nh\u1EADp (v\u00ED d\u1EE5 truyencv.com)\r\n3. Nh\u1EA5n F12 ho\u1EB7c t\u1ED5 h\u1EE3p CTRL + SHIFT +I, s\u1EBD c\u00F3 1 tab m\u1EDF l\u00EAn.\r\n4. Nh\u1EA5n v\u00E0o tab Console tr\u00EAn c\u1EEDa s\u1ED5 v\u1EEBa hi\u1EC7n, d\u00E1n script copy v\u00E0o v\u00E0 nh\u1EA5n Enter.\r\n5. Chuy\u1EC3n v\u1EC1 GHFU ch\u1ECDn \u0111\u00FAng host v\u00E0 nh\u1EA5n "D\u00E1n & L\u01B0u Th\u00F4ng Tin \u0110\u0103ng Nh\u1EADp".\r\n6. Xong, b\u1EA1n \u0111\u00E3 l\u01B0u th\u00F4ng tin \u0111\u0103ng nh\u1EADp gi\u1EDD b\u1EA1n c\u00F3 th\u1EC3 t\u1EA3i truy\u1EC7n VIP, ho\u1EB7c n\u1ED9i dung b\u1EAFt bu\u1ED9c \u0111\u0103ng nh\u1EADp.
