<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MBC Stamp Fixer</title>
    <style>
        body {
            width: 250px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            background: #ffffff;
            color: #333;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #0056b3;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <h2>MBC Stamp Fixer</h2>
    <p class="desc">Trợ lý hỗ trợ cố định con dấu trên hệ thống Intramart.</p>
    <button id="btn-inspect">Bật chế độ chọn Dấu</button>
    <button id="btn-save-config">Lưu cấu hình mặc định</button>
    <script src="popup.js"></script>
</body>
</html>
