  <script>
    const lessons = [{"day": "1", "title": "Day 1 — Cơ sở dữ liệu toàn bộ tướng và tướng ẩn", "file": "001_Day 1 — Cơ sở dữ liệu toàn bộ tướng và tướng ẩn.html", "html": "<div class=\"main-section\">\n  <div class=\"section-label\">📖 Nội dung chính<\/div>\n  <h1>DAY 1: THIẾT LẬP CƠ SỞ DỮ LIỆU TƯỚNG VÀ PHƯƠNG PHÁP KIỂM CHỨNG (SANGO HEROES 7)<\/h1>\n<h2>1. TẠI SAO CẦN LẬP BẢNG DỮ LIỆU CÓ NGUỒN TRÍCH XUẤT?<\/h2>\n<p>Trong Tam Quốc Quần Anh Truyện VII (Sango Heroes 7), các thông số tướng (Vũ lực, Trí lực, Võ tướng kỹ, Quân sư kỹ) và điều kiện thu phục/xuất hiện có sự khác biệt rất lớn giữa các phiên bản gốc (Vanilla v1.0, v1.22) và vô số bản Mod. Việc ghi chép từ diễn đàn hoặc bộ nhớ cá nhân dễ dẫn đến thông tin sai lệch. Bài học này hướng dẫn bạn dựng khung dữ liệu chuẩn xác để tự trích xuất dữ liệu thực tế.<\/p>\n<h2>2. CẤU TRÚC BẢNG DỮ LIỆU CHUẨN (10 CỘT THÔNG TIN)<\/h2>\n<p>Bạn hãy mở phần mềm Bảng tính (Excel hoặc Google Sheets) và tạo Sheet tên <code>Generals_Database<\/code> gồm đúng 10 cột sau:\n1. <strong>General_ID<\/strong>: Mã số định danh của tướng trong file game (VD: 1, 2, 3...).\n2. <strong>General_Name<\/strong>: Tên tướng (Phiên âm Hán - Việt / Tên gốc trong game).\n3. <strong>Faction<\/strong>: Phe / Thế lực ban đầu hoặc trạng thái (Tự do / Tướng ẩn / Sự kiện).\n4. <strong>Base_Force<\/strong>: Chỉ số Vũ lực gốc chưa qua trang bị.\n5. <strong>Base_Intellect<\/strong>: Chỉ số Trí lực gốc chưa qua trang bị.\n6. <strong>Unique_Skills<\/strong>: Võ tướng kỹ / Quân sư kỹ đặc biệt ban đầu.\n7. <strong>Spawn_Condition<\/strong>: Điều kiện xuất hiện (Năm, Thành trì, Tướng ẩn yêu cầu mã gọi hoặc sự kiện).\n8. <strong>Data_Type<\/strong>: Phân loại bản game (Bản gốc Vanilla hay Bản Mod cụ thể).\n9. <strong>Verification_Source<\/strong>: Đường dẫn file dữ liệu gốc (VD: <code>Setting/General.ini<\/code>) hoặc phương pháp test.\n10. <strong>Confidence_Score<\/strong>: Mức độ tin cậy (100% - Đã kiểm tra file/in-game; 50% - Cần đối soát lại).<\/p>\n<h2>3. PHƯƠNG PHÁP TRÍCH XUẤT DỮ LIỆU TỪ GAME<\/h2>\n<h3>Cách 1: Trích xuất từ file cấu hình game (Độ tin cậy: Cao nhất)<\/h3>\n<ul>\n<li>Mở thư mục cài đặt Tam Quốc Quần Anh Truyện VII trên máy tính.<\/li>\n<li>Tìm thư mục <code>Setting<\/code> (hoặc mở file nén dữ liệu <code>Data.pak<\/code> / <code>Patch.pak<\/code> bằng công cụ giải nén Pak nếu game nén file).<\/li>\n<li>Mở file <code>General.ini<\/code> bằng Notepad hoặc Notepad++.<\/li>\n<li>Cấu trúc tiêu chuẩn trong file:<\/li>\n<li><code>No<\/code>: Mã ID tướng.<\/li>\n<li><code>Name<\/code>: Tên tướng.<\/li>\n<li><code>Str<\/code>: Vũ lực cơ bản.<\/li>\n<li><code>Int<\/code>: Trí lực cơ bản.<\/li>\n<\/ul>\n<h3>Cách 2: Kiểm chứng trực tiếp In-Game bằng lệnh Cheat/Test<\/h3>\n<ul>\n<li>Tại màn hình đại lục, gõ chuỗi <code>usecheat<\/code> để bật chế độ test.<\/li>\n<li>Nhập lệnh gọi tướng theo ID để xác minh tướng ẩn/tướng thường có tồn tại trong phiên bản bạn đang chơi hay không.<\/li>\n<\/ul>\n<h2>4. QUY TRÌNH XỬ LÝ KHOẢNG TRỐNG DỮ LIỆU<\/h2>\n<ul>\n<li>Nếu chưa mở được file <code>.ini<\/code> hoặc chưa test được in-game đối với một tướng ẩn cụ thể, đánh dấu cột <code>Confidence_Score<\/code> là <strong>Chờ kiểm chứng<\/strong> và để trống cột chỉ số. Tuyệt đối không tự điền chỉ số dựa trên cảm tính hoặc trí nhớ.<\/li>\n<\/ul>\n<h2>Đầu ra cần nộp<\/h2>\n<p>1 File Bảng tính (Excel hoặc Google Sheets) chứa bảng cấu hình 10 cột, đã điền hoàn chỉnh dữ liệu kiểm chứng của ít nhất 10 tướng (gồm tướng thường và tướng ẩn/mã ID) trích xuất trực tiếp từ bản game hiện có.<\/p>\n<h2>Checklist hoàn thành<\/h2>\n<ul>\n<li>[ ] Bảng tính có đủ 10 cột thông tin theo chuẩn thiết kế.<\/li>\n<li>[ ] Đã điền ít nhất 10 tướng từ bản game thực tế đang cài trên máy.<\/li>\n<li>[ ] Tất cả các dòng dữ liệu đều có ghi rõ đường dẫn file nguồn hoặc lệnh test và mức độ tin cậy.<\/li>\n<\/ul>\n<h2>Cần bạn xác nhận trước Day tiếp theo<\/h2>\n<ul>\n<li>Bạn đang cài đặt phiên bản game nào (Bản gốc v1.0/v1.22 hay một bản Mod cụ thể như Bảo Đao, Tố Phong)?<\/li>\n<li>Thư mục game trên máy bạn có hiển thị rõ file Setting/General.ini hay dữ liệu đang bị đóng gói trong file .pak?<\/li>\n<\/ul>\n<blockquote>\n<p>Hình minh họa nên có: Mô tả cấu trúc bảng dữ liệu Excel chuẩn và quy trình đối soát từ file General.ini vào bảng tính.<\/p>\n<\/blockquote>\n<\/div>", "summary": "📖 Nội dung chính DAY 1: THIẾT LẬP CƠ SỞ DỮ LIỆU TƯỚNG VÀ PHƯƠNG PHÁP KIỂM CHỨNG (SANGO HEROES 7) 1. TẠI SAO CẦN LẬP BẢNG DỮ LIỆU CÓ NGUỒN TRÍCH XUẤT? Trong Tam Quốc Quần Anh Truyện VII (Sango Heroes 7), các thông số tướn", "sources": ["Trích xuất trực tiếp từ file cấu hình hệ thống game Sango Heroes 7 (Setting/General.ini hoặc file pak giải nén).", "Kiểm chứng qua chế độ lệnh test trực tiếp trong phiên bản game người học đang cài đặt."], "questions": ["Bạn đang cài đặt phiên bản game nào (Bản gốc v1.0/v1.22 hay một bản Mod cụ thể như Bảo Đao, Tố Phong)?", "Thư mục game trên máy bạn có hiển thị rõ file Setting/General.ini hay dữ liệu đang bị đóng gói trong file .pak?"], "visual_assets": [], "structured": true}, {"day": "2", "title": "Day 2 — Binh chủng, bí mật và dữ liệu cần xác minh", "file": "002_Day 2 — Binh chủng, bí mật và dữ liệu cần xác minh.html", "html": "<div class=\"main-section\">\n  <div class=\"section-label\">📖 Nội dung chính<\/div>\n  <h1>Bài học Day 2: Quy trình kiểm kê Binh chủng, Bí mật và Dữ liệu trong Tam Quốc Quần Anh Truyện VII<\/h1>\n<h2>1. Nguyên tắc cốt lõi về dữ liệu<\/h2>\n<p>Trong Tam Quốc Quần Anh Truyện VII (Sango Heroes 7), các thông số về binh chủng (sức tấn công, tầm đánh, chuỗi nâng cấp từ Cấp 1 -&gt; Cấp 2 -&gt; Cấp 3), hệ thống khắc chế, tọa độ địa điểm bí mật (như Tiên Nhân Động, Mộc Nhân Xưởng...) và sự kiện ẩn phụ thuộc hoàn toàn vào phiên bản game (Vanilla gốc v1.0/v1.22 hoặc các bản Mod như 7.0, Ba Vương Hùng Khởi...).<\/p>\n<p><strong>Cảnh báo quan trọng:<\/strong> Do chưa có tài liệu game cục bộ được xác thực đính kèm, bài học này <strong>tuyệt đối không tự bịa đặt hay sử dụng dữ liệu truyền miệng/chưa kiểm chứng<\/strong> về tọa độ, chỉ số hay điều kiện mở khóa. Người học sẽ xây dựng bộ khung chuẩn mực để tự kiểm chứng và điền dữ liệu từ chính bản game đang vận hành.<\/p>\n<h2>2. Cấu trúc bảng kiểm kê Binh chủng (Tab: Troops_Database)<\/h2>\n<p>Bạn cần thiết lập bảng tính với các thuộc tính tiêu chuẩn sau để lưu trữ thông tin binh chủng:<\/p>\n<ul>\n<li><strong>ID_BinhChung:<\/strong> Mã định danh (Ví dụ: <code>TR_001<\/code>)<\/li>\n<li><strong>Ten_BinhChung:<\/strong> Tên hiển thị chính xác trong game<\/li>\n<li><strong>Cap_Do:<\/strong> 1 (Sơ cấp), 2 (Trung cấp), 3 (Cao cấp / Đặc biệt)<\/li>\n<li><strong>Chuoi_NangCap:<\/strong> Binh chủng cấp tiếp theo (Ví dụ: Đao Binh -&gt; Đại Đao Binh -&gt; Thần Đao Binh)<\/li>\n<li><strong>DieuKien_Up:<\/strong> Cấp độ Tướng / Thẻ Binh Chủng / Công trình cần thiết<\/li>\n<li><strong>Khac_Che:<\/strong> Binh chủng khắc chế tốt nhất (xác nhận qua thực chiến)<\/li>\n<li><strong>Bi_Khac:<\/strong> Binh chủng bị khắc chế nặng<\/li>\n<li><strong>PhienBan_Tag:<\/strong> Gắn nhãn <code>Vanilla<\/code> hoặc <code>Mod_[TênMod]<\/code><\/li>\n<li><strong>TrangThai_XacMinh:<\/strong> <code>Đã kiểm chứng<\/code> / <code>Chưa kiểm chứng<\/code><\/li>\n<\/ul>\n<h2>3. Cấu trúc bảng kiểm kê Địa điểm Bí mật &amp; Sự kiện ẩn (Tab: Secrets_Events)<\/h2>\n<p>Để thu thập các vị trí ẩn và sự kiện đặc biệt, hãy tạo khung dữ liệu:<\/p>\n<ul>\n<li><strong>Ten_DiaDiem_SuKien:<\/strong> Tên địa điểm/sự kiện (Ví dụ: Tiên Cụm, Tháp Động...)<\/li>\n<li><strong>ToaDo_DieuKien:<\/strong> Tọa độ hiển thị trên bản đồ hoặc điều kiện thời gian/sự kiện xuất hiện<\/li>\n<li><strong>PhanThuong_VatPham:<\/strong> Trang bị, binh thư hoặc chỉ số thu được khi hoàn thành<\/li>\n<li><strong>PhienBan_Tag:<\/strong> Nhãn <code>Vanilla<\/code> hoặc <code>Mod_[TênMod]<\/code><\/li>\n<li><strong>Tep_Anh_BangChung:<\/strong> Tên file ảnh chụp màn hình chứng thực<\/li>\n<\/ul>\n<h2>4. Quy chuẩn chụp ảnh làm bằng chứng (Evidence Standard)<\/h2>\n<p>Để đảm bảo dữ liệu không bị sai lệch, mỗi dòng thông tin trong cơ sở dữ liệu phải đi kèm bằng chứng ảnh:\n- <strong>Đối với Binh chủng:<\/strong> Chụp rõ màn hình thông tin binh chủng (thông số công/thủ, mô tả nâng cấp) trong giao diện game.\n- <strong>Đối với Bí mật/Sự kiện:<\/strong> Chụp màn hình nhân vật đứng tại vị trí tọa độ trên bản đồ kèm bảng thông báo phần thưởng nhận được.\n- <strong>Quy tắc đặt tên file ảnh:<\/strong> <code>[Loai]_[TenDoiTuong]_[PhienBan]_[YYYYMMDD].png<\/code> (Ví dụ: <code>Troop_Thandoabinh_Mod7.0_20231025.png<\/code>).<\/p>\n<h2>Đầu ra cần nộp<\/h2>\n<p>Một file bảng tính chứa 2 tab (Troops_Database và Secrets_Events) đã được dựng khung chuẩn, điền thử nghiệm ít nhất 1 chuỗi binh chủng và 1 địa điểm bí mật thực tế thu thập từ bản game đang chơi, kèm 2 ảnh chụp màn hình bằng chứng tương ứng.<\/p>\n<h2>Checklist hoàn thành<\/h2>\n<ul>\n<li>[ ] Bảng tính có đầy đủ các cột thuộc tính theo đúng hướng dẫn bài học.<\/li>\n<li>[ ] Mọi dòng dữ liệu đều có nhãn phân loại Vanilla hoặc Mod rõ ràng.<\/li>\n<li>[ ] Không chứa bất kỳ thông số hay tọa độ giả định nào chưa qua thực nghiệm trong game.<\/li>\n<li>[ ] File ảnh bằng chứng tuân thủ đúng quy tắc đặt tên tiêu chuẩn.<\/li>\n<\/ul>\n<h2>Cần bạn xác nhận trước Day tiếp theo<\/h2>\n<ul>\n<li>Bạn đang chơi phiên bản game gốc (Vanilla v1.0/v1.22) hay một bản Mod cụ thể nào (như 7.0, Ba Vương Hùng Khởi...)?<\/li>\n<li>Trong buổi thực hành 45 phút hôm nay, bạn muốn ưu tiên kiểm kê chuỗi binh chủng hay săn tìm địa điểm bí mật trước?<\/li>\n<\/ul>\n<blockquote>\n<p>Hình minh họa nên có: Minh họa cấu trúc các cột trong bảng tính dữ liệu và vị trí hiển thị bảng thông số binh chủng/tọa độ trong game để chụp ảnh bằng chứng chuẩn xác.<\/p>\n<\/blockquote>\n<\/div>", "summary": "📖 Nội dung chính Bài học Day 2: Quy trình kiểm kê Binh chủng, Bí mật và Dữ liệu trong Tam Quốc Quần Anh Truyện VII 1. Nguyên tắc cốt lõi về dữ liệu Trong Tam Quốc Quần Anh Truyện VII (Sango Heroes 7), các thông số về bin", "sources": ["Kiểm chứng trực tiếp từ phiên bản game Sango Heroes 7 đang vận hành trên máy người học", "Phương pháp quản lý cơ sở dữ liệu thực nghiệm không dựa vào dữ liệu chưa kiểm chứng"], "questions": ["Bạn đang chơi phiên bản game gốc (Vanilla v1.0/v1.22) hay một bản Mod cụ thể nào (như 7.0, Ba Vương Hùng Khởi...)?", "Trong buổi thực hành 45 phút hôm nay, bạn muốn ưu tiên kiểm kê chuỗi binh chủng hay săn tìm địa điểm bí mật trước?"], "visual_assets": [], "structured": true}, {"day": "3", "title": "Day 3 — Train tướng, trang bị, kỹ năng và ghép tướng", "file": "003_Day 3 — Train tướng, trang bị, kỹ năng và ghép tướ.html", "html": "<div class=\"main-section\">\n  <div class=\"section-label\">📖 Nội dung chính<\/div>\n  <h1>Bài học Day 3: Phương pháp kiểm chứng Train tướng, Trang bị, Kỹ năng và Phối hợp nhóm<\/h1>\n<h2>1. Nguyên tắc kiểm chứng trong Sango Heroes 7<\/h2>\n<p>Mỗi bản game (gốc v1.0, v1.2, hoặc các bản Mod như Bá Vương Độc Lập, Bảo Thương, v.v.) có sự thay đổi lớn về chỉ số trang bị, lượng kinh nghiệm train tướng, và hiệu ứng kỹ năng/combo. Do đó, tuyệt đối không áp đặt bất kỳ 'công thức build chuẩn' nào từ internet mà phải thông qua quy trình thử nghiệm thực tế trên chính bản game bạn đang sở hữu.<\/p>\n<h2>2. Mẫu hồ sơ Build (Build Profile Template)<\/h2>\n<p>Một hồ sơ build tiêu chuẩn trong bảng tính của bạn cần bao gồm các trường dữ liệu:\n- <strong>Thông tin gốc<\/strong>: Mã phiên bản/Mod, Tên tướng, Nhóm tướng (Vũ tướng / Văn quan / Toàn năng), Cấp độ, Chỉ số gốc (Vũ lực, Trí lực).\n- <strong>Cấu hình thử nghiệm<\/strong>: Vũ khí, Ngựa, Đạo cụ bổ trợ, Kỹ năng cá nhân &amp; Kỹ năng tổ hợp (Combo skills).\n- <strong>Mục tiêu thử nghiệm<\/strong>: Khả năng dọn lính (AOE), Khả năng diệt tướng (Single-target), Độ bền (Máu/Thủ).<\/p>\n<h2>3. Quy trình thử nghiệm lặp lại (Iterative Testing Protocol)<\/h2>\n<ul>\n<li><strong>Bước 1 (Lập giả thuyết)<\/strong>: Đặt ra giả định (Ví dụ: 'Tướng A mang vũ khí X quét lính nhanh hơn 20% so với mang vũ khí Y').<\/li>\n<li><strong>Bước 2 (Cố định biến số)<\/strong>: Chọn môi trường thử nghiệm cố định (Cùng số lượng quân địch, cùng loại địa hình, cùng cấp độ tướng và quân).<\/li>\n<li><strong>Bước 3 (Thực nghiệm lặp lại)<\/strong>: Thực hiện tối thiểu 3 trận đánh độc lập dưới cùng điều kiện, ghi nhận thông số.<\/li>\n<li><strong>Bước 4 (Đối soát kết quả)<\/strong>: So sánh trung bình chỉ số thu được để xác nhận hoặc bác bỏ giả thuyết.<\/li>\n<\/ul>\n<h2>4. Các chỉ số đo lường kết quả (Metrics)<\/h2>\n<ul>\n<li><strong>Thời gian hoàn thành trận đánh<\/strong> (tính bằng giây/phút).<\/li>\n<li><strong>Lượng HP/MP hao hụt<\/strong> của tướng sau trận.<\/li>\n<li><strong>Tỷ lệ sát thương gây ra<\/strong> giữa Kỹ năng cá nhân và Kỹ năng tổ hợp (Ghép tướng).<\/li>\n<li><strong>Lượng EXP thu được trên đơn vị thời gian<\/strong> (EXP/phút).<\/li>\n<\/ul>\n<h2>5. Điều kiện nâng cấp giả thuyết thành 'Dữ liệu đã kiểm chứng'<\/h2>\n<p>Một mẹo (tip) hoặc công thức build chỉ được nâng hạng từ 'Giả thuyết' lên 'Đã kiểm chứng' khi:\n1. Đã trải qua tối thiểu 3 lần thử nghiệm lặp lại cho kết quả nhất quán (độ lệch sai số &lt; 5%).\n2. Đã gắn liền với mã phiên bản/mod cụ thể.\n3. Có số liệu đo lường định lượng kèm theo.<\/p>\n<h2>6. Các dữ kiện hiện chưa thể kết luận<\/h2>\n<ul>\n<li>Công thức kích hoạt kỹ năng ghép ẩn của từng cặp tướng cụ thể trên bản game của bạn.<\/li>\n<li>Trang bị nào là 'mạnh nhất' trong game (phụ thuộc hoàn toàn vào chỉ số được quy định trong file cấu hình của bản Mod/Patch bạn đang dùng).<\/li>\n<\/ul>\n<h2>Đầu ra cần nộp<\/h2>\n<p>Mẫu bảng tính 'Hồ sơ thử nghiệm Build' chứa ít nhất 2 bản ghi thử nghiệm (mỗi bản ghi gồm: Mã phiên bản, Tướng, Trang bị/Kỹ năng, Kết quả 3 lần test lặp lại, Chỉ số đo lường và Trạng thái kiểm chứng).<\/p>\n<h2>Checklist hoàn thành<\/h2>\n<ul>\n<li>[ ] Đã thiết lập đầy đủ các cột thông tin trong Mẫu hồ sơ Build trên bảng tính.<\/li>\n<li>[ ] Đã thực hiện thử nghiệm lặp lại 3 lần cho 1 cấu hình tướng/trang bị và ghi lại chỉ số đo lường cụ thể.<\/li>\n<li>[ ] Đánh dấu đúng trạng thái 'Giả thuyết' hoặc 'Đã kiểm chứng' dựa trên tiêu chuẩn đã đề xuất.<\/li>\n<\/ul>\n<h2>Cần bạn xác nhận trước Day tiếp theo<\/h2>\n<ul>\n<li>Bạn đang chơi bản Tam Quốc Quần Anh Truyện VII gốc (v1.0/v1.2) hay một bản Mod cụ thể nào (như Bá Vương Độc Lập, Bảo Thương)?<\/li>\n<li>Tướng bạn muốn thử nghiệm train đầu tiên thuộc nhóm thiên về Vũ lực (chém quét) hay Trí lực (dùng phép)?<\/li>\n<\/ul>\n<blockquote>\n<p>Hình minh họa nên có: Minh họa cấu trúc bảng ghi chép hồ sơ build tướng và quy trình thử nghiệm lặp lại để đo lường hiệu quả trang bị/kỹ năng.<\/p>\n<\/blockquote>\n<\/div>", "summary": "📖 Nội dung chính Bài học Day 3: Phương pháp kiểm chứng Train tướng, Trang bị, Kỹ năng và Phối hợp nhóm 1. Nguyên tắc kiểm chứng trong Sango Heroes 7 Mỗi bản game (gốc v1.0, v1.2, hoặc các bản Mod như Bá Vương Độc Lập, Bả", "sources": ["Quy trình thực nghiệm và kiểm định dữ liệu trò chơi dựa trên phương pháp quản lý thông tin khoa học."], "questions": ["Bạn đang chơi bản Tam Quốc Quần Anh Truyện VII gốc (v1.0/v1.2) hay một bản Mod cụ thể nào (như Bá Vương Độc Lập, Bảo Thương)?", "Tướng bạn muốn thử nghiệm train đầu tiên thuộc nhóm thiên về Vũ lực (chém quét) hay Trí lực (dùng phép)?"], "visual_assets": [], "structured": true}];
    const escapeHtml = (text) => String(text || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function renderDay(index) {
      const item = lessons[index]; if (!item) return;
      document.querySelectorAll('.day-item').forEach((node, i) => node.classList.toggle('active', i === index));
      const sources = item.sources.length ? '<div class="source-box"><b>Nguồn AI khai báo:</b><ul>' + item.sources.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div>' : '<div class="source-box"><b>Chưa có nguồn kiểm chứng đính kèm.</b> Nội dung này chỉ dùng làm khung học, không nên coi là thông số/sự thật đầy đủ.</div>';
      const questions = item.questions.length ? '<div class="question-box"><b>Cần bạn xác nhận trước Day tiếp theo:</b><ul>' + item.questions.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div>' : '';
      const evidence = item.sources.length ? '<span class="badge info">Có khai báo nguồn</span>' : '<span class="badge warn">Cần dữ liệu nguồn</span>';
      const visual = item.visual_assets.length ? '<span class="badge ok">' + item.visual_assets.length + ' ảnh đã lưu</span>' : '<span class="badge warn">Chưa có ảnh thật</span>';
      document.getElementById('lesson').innerHTML = '<a class="open-page" href="' + encodeURI(item.file) + '">Mở trang riêng ↗</a><h1>Day ' + escapeHtml(item.day) + ' — ' + escapeHtml(item.title.replace(/^Day\s+[^—]+—\s*/, '')) + '</h1><div class="lesson-meta">' + evidence + visual + (item.structured ? '<span class="badge ok">Bài học có cấu trúc</span>' : '<span class="badge warn">Bản legacy</span>') + '</div>' + sources + questions + item.html;
      history.replaceState(null, '', '#day-' + item.day);
    }
    function buildList() {
      const list = document.getElementById('dayList');
      list.innerHTML = lessons.map((item, i) => '<button class="day-item" onclick="renderDay(' + i + ')"><span class="day-num">Day ' + escapeHtml(item.day) + '</span><span class="day-title">' + escapeHtml(item.title.replace(/^Day\s+[^—]+—\s*/, '')) + '</span></button>').join('');
    }
    function filterDays() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.day-item').forEach(function(item, index) {
        var data = lessons[index];
        item.style.display = (data.title + ' ' + data.summary).toLowerCase().includes(q) ? 'block' : 'none';
      });
    }
    buildList();
    const requested = (location.hash.match(/#day-([^&]+)/) || [])[1];
    const initial = Math.max(0, lessons.findIndex(x => String(x.day) === String(requested)));
    if (lessons.length) renderDay(initial);
  </script>
